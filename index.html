
<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#12345a">
  <title>ASAS | Portal Pentaksiran KVDSMZ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>ASAS</h1>
    <p>Portal Pentaksiran KVDSMZ</p>
  </header>

  <main>
    <section id="loginPanel">
      <h2>Log Masuk Pelajar</h2>
      <p>Masukkan nombor pelajar dan PIN anda.</p>

      <form id="loginForm">
        <label for="noPelajar">Nombor Pelajar</label>
        <input
          id="noPelajar"
          name="noPelajar"
          type="text"
          autocomplete="username"
          required
          maxlength="30"
          placeholder="Contoh: UJIAN001"
        >

        <label for="pin">PIN 6 Digit</label>
        <input
          id="pin"
          name="pin"
          type="password"
          inputmode="numeric"
          pattern="[0-9]{6}"
          minlength="6"
          maxlength="6"
          autocomplete="current-password"
          required
          placeholder="Masukkan PIN"
        >

        <button id="loginButton" type="submit">Log Masuk</button>
      </form>

      <p id="status" role="status" aria-live="polite">
        Sila log masuk untuk meneruskan.
      </p>
    </section>

    <section id="studentPanel" hidden>
      <h2>Selamat Datang</h2>
      <p id="namaPelajar"></p>
      <p id="maklumatPelajar"></p>
      
<p id="statusPelajar" role="status"></p>

<hr>

<section id="subjekPanel">
  <h2>Subjek Saya</h2>
  <p id="statusSubjek" role="status">
    Senarai subjek akan dipaparkan di sini.
  </p>
  <div id="senaraiSubjek"></div>
</section>

<button id="logoutButton" type="button">Log Keluar</button>

    </section>
  </main>

  <footer>
    <p>KVDSMZ · ASAS Portal Pentaksiran</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
